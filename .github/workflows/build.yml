name: Build portable binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run tests without requesting shutdown
        run: dotnet test Skipower.slnx -c Release
      - name: Publish Native AOT executables and create portable ZIP
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: skipower-${{ matrix.rid }}
          path: artifacts/skipower-${{ matrix.rid }}.zip
          if-no-files-found: error
          compression-level: 0
